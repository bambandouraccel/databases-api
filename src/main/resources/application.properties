# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=databases-api
spring.profiles.active=prod
spring.main.allow-bean-definition-overriding=false
spring.main.banner-mode=off

# ===============================
# DATABASE CONFIGURATION - MONGODB
# ===================================

# For dev
#spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:admin@192.168.42.142:27017/databases?authSource=admin}
#spring.data.mongodb.auto-index-creation=true

# For prod
#spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:admin@mongodb.databases-api-microservice.svc.cluster.local:27017/databases?authSource=admin}
spring.data.mongodb.auto-index-creation=true


# Configuration du pool de connexions (optimisation production)
spring.data.mongodb.connections-per-host=100
spring.data.mongodb.threads-allowed-to-block-for-connection-multiplier=5
spring.data.mongodb.connect-timeout=5000
spring.data.mongodb.socket-timeout=30000

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
server.connection-timeout=5000
server.servlet.context-path=/api
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ===============================
# LOGGING CONFIGURATION (Production)
# ===============================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.data.mongodb=WARN
logging.level.com.yourpackage=DEBUG
logging.file.name=logs/application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# SECURITY & SSL (À configurer selon ton infrastructure)
# ===============================
# server.ssl.key-store-type=PKCS12
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-alias=tomcat

# ===============================
# ACTUATOR (Monitoring production)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=false

# ===============================
# PERFORMANCE & OPTIMIZATION
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.data.mongodb.repositories.type=imperative


